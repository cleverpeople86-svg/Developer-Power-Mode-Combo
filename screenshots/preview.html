<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Developer Power Mode Combo — local preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(145deg, #111525, #17182b 55%, #151323);
        color: #f6f2ff;
        font: 15px/1.6 "Segoe UI", system-ui, sans-serif;
      }
      .topline {
        display: flex;
        height: 60px;
        align-items: center;
        justify-content: flex-end;
        padding: 0 26px;
        border-bottom: 1px solid #2e3048;
        background: #11152355;
        color: #aaa8c2;
        font-size: 12px;
      }
      main { width: min(740px, calc(100% - 40px)); margin: 73px auto; }
      .eyebrow {
        color: #71e5c6;
        font: 700 11px ui-monospace, monospace;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      h1 { margin: 11px 0; font-size: clamp(29px, 5vw, 43px); line-height: 1.13; letter-spacing: -1px; }
      .lede { max-width: 540px; color: #b5b1c9; }
      .card {
        margin-top: 28px;
        padding: 21px;
        border: 1px solid #34334a;
        border-radius: 15px;
        background: #1c1b2abf;
        box-shadow: 0 12px 40px #05061035;
      }
      label { display: block; margin-bottom: 7px; color: #e1dafa; font-size: 12px; font-weight: 650; }
      input, textarea, [contenteditable="true"] {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #49435f;
        border-radius: 8px;
        outline: none;
        background: #11111e;
        color: #f2ecff;
        font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      }
      input:focus, textarea:focus, [contenteditable="true"]:focus { border-color: #70e5c7; box-shadow: 0 0 0 3px #70e5c71b; }
      textarea { min-height: 91px; margin-top: 15px; resize: vertical; }
      .hint { margin: 14px 0 0; color: #9793ad; font-size: 11px; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 20px; }
      .chips span { padding: 5px 9px; border: 1px solid #3e3b53; border-radius: 30px; color: #c5bfd6; font-size: 11px; }
      body.typing-preview .topline,
      body.typing-preview .eyebrow,
      body.typing-preview h1,
      body.typing-preview label[for="notes"],
      body.typing-preview #notes,
      body.typing-preview .hint,
      body.typing-preview .chips { display: none; }
      body.typing-preview main { margin: 0 auto; padding-top: 86px; }
      body.typing-preview .lede { margin: 0 0 11px; font-size: 13px; }
      body.typing-preview .card { margin-top: 0; padding: 14px 17px; }
      body.typing-preview label[for="type-here"] { margin-bottom: 6px; }
      body.typing-preview #type-here { min-height: 50px; font-size: 15px; }
    </style>
  </head>
  <body>
    <script>
      const previewOptions = new URLSearchParams(location.search);
      if (previewOptions.has("typing")) {
        document.body.classList.add("typing-preview");
      }
      if (previewOptions.has("capture")) {
        Object.defineProperty(document, "hidden", {
          configurable: true,
          get: () => false
        });
      }
    </script>
    <div class="topline"></div>
    <main>
      <div class="eyebrow">Developer Power Mode</div>
      <h1>Find your flow.<br>Keep your combo.</h1>
      <p class="lede">A few tiny companions for the quiet spaces between keystrokes. Your notes stay right here on this page.</p>
      <section class="card">
        <label for="type-here">TRY A FEW KEYSTROKES</label>
        <input id="type-here" type="text" placeholder="Start typing to make a little sparkle…">
        <label for="notes" style="margin-top:16px">SCRATCH PAD</label>
        <textarea id="notes" placeholder="Pause whenever you like. The pets keep swimming."></textarea>
        <p class="hint">Combo resets after 1.5 seconds or when you switch editors.</p>
        <div class="chips"><span>Corgi companion</span><span>Kitty companion</span><span>Octopus companion</span></div>
      </section>
    </main>
    <script>
      const defaults = { powerMode: true, petMode: "all" };
      Object.defineProperty(globalThis, "innerWidth", {
        configurable: true,
        value: document.documentElement.clientWidth
      });
      Object.defineProperty(globalThis, "chrome", {
        configurable: true,
        value: {
          runtime: { lastError: null },
          storage: {
            local: {
              get(fallbacks, callback) {
                queueMicrotask(() => callback({ ...fallbacks, ...defaults }));
              },
              set(value, callback) {
                Object.assign(defaults, value);
                callback();
              }
            },
            onChanged: { addListener() {} }
          }
        }
      });
    </script>
    <script src="../logic.js"></script>
    <script src="../pets.js"></script>
    <script src="../content.js"></script>
  </body>
</html>
